<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 1 Add Students</title>
    <style>

        /* ============================================================
           RESET
        ============================================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ============================================================
           PAGE BACKGROUND
           body — no id/class needed; styled directly
        ============================================================ */
        body {
            min-height: 100vh;
            background: linear-gradient(150deg, #0f0025 0%, #1e0550 35%, #3b0764 65%, #5b21b6 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ============================================================
           CARD HEADER — h2
           ADD: id="form-title"
        ============================================================ */
        #form-title {
            width: 100%;
            max-width: 520px;
            background: linear-gradient(135deg, rgba(109, 40, 217, 0.75), rgba(91, 33, 182, 0.65));
            color: #ffffff;
            font-size: clamp(1.15rem, 3vw, 1.55rem);
            font-weight: 800;
            letter-spacing: -0.3px;
            text-align: center;
            padding: 22px 36px 20px;
            border-radius: 18px 18px 0 0;
            border: 1px solid rgba(196, 181, 253, 0.25);
            border-bottom: none;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        }

        /* ============================================================
           FORM CARD — <form>
           ADD: id="student-form"
        ============================================================ */
        #student-form {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 0 0 18px 18px;
            padding: 30px 36px 34px;
            border: 1px solid rgba(196, 181, 253, 0.2);
            border-top: none;
            box-shadow:
                0 28px 68px rgba(58, 16, 108, 0.55),
                0 6px 18px rgba(0, 0, 0, 0.22);
        }

        /* ============================================================
           FORM FIELDS
           Django's {{form.as_ul}} auto-generates:
             <ul> <li> <label> <input>
           These are styled via descendant selectors on #student-form.
           No ids/classes needed on these — Django controls them.
           (Django assigns id="id_<fieldname>" to each <input>
            automatically, usable if per-field overrides are needed.)
        ============================================================ */
        #student-form ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 26px;
        }

        #student-form li {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #student-form label {
            color: #4c1d95;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.85px;
            text-transform: uppercase;
        }

        #student-form input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #ddd6fe;
            border-radius: 9px;
            font-size: 0.93rem;
            color: #1e1b4b;
            background: #faf8ff;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        #student-form input:focus {
            border-color: #7c3aed;
            background: #ffffff;
            box-shadow: 0 0 0 3.5px rgba(124, 58, 237, 0.14);
        }

        #student-form input::placeholder {
            color: #c4b5fd;
        }

        /* ============================================================
           STORE RECORD BUTTON — <button type="submit">
           ADD: id="btn-store"   class="btn"
        ============================================================ */
        #btn-store {
            background: linear-gradient(135deg, #5b21b6 0%, #7c3aed 100%);
            color: #ffffff;
            border: none;
            padding: 11px 22px;
            border-radius: 9px;
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.35px;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.45);
            margin-right: 10px;
        }

        #btn-store:hover {
            background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 100%);
            box-shadow: 0 6px 22px rgba(124, 58, 237, 0.55);
            transform: translateY(-1px);
        }

        #btn-store:active {
            transform: translateY(0px);
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.35);
        }

        /* ============================================================
           RESET BUTTON — <button> (wrapping <a>)
           ADD: id="btn-reset"   class="btn"
        ============================================================ */
        #btn-reset {
            background: transparent;
            border: 2px solid #7c3aed;
            padding: 9px 18px;
            border-radius: 9px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        #btn-reset a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.88rem;
        }

        #btn-reset:hover {
            background: #f3f0ff;
            transform: translateY(-1px);
        }

        #btn-reset:active {
            transform: translateY(0px);
        }

        /* ============================================================
           VIEW RECORDS LINK — <a target="_blank" …>
           ADD: id="view-records-link"
        ============================================================ */
        #view-records-link {
            display: block;
            width: 100%;
            max-width: 520px;
            text-align: center;
            color: #c4b5fd;
            text-decoration: none;
            font-size: 0.83rem;
            font-weight: 600;
            letter-spacing: 0.35px;
            margin-top: 16px;
            padding: 9px 20px;
            border-radius: 10px;
            border: 1px solid rgba(196, 181, 253, 0.2);
            transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        #view-records-link:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(196, 181, 253, 0.42);
        }

        /* ============================================================
           RESPONSIVE — mobile (≤ 480 px)
        ============================================================ */
        @media (max-width: 480px) {

            #form-title {
                padding: 18px 20px 16px;
                border-radius: 14px 14px 0 0;
            }

            #student-form {
                padding: 22px 18px 26px;
                border-radius: 0 0 14px 14px;
            }

            /* Stack buttons vertically on small screens */
            #btn-store,
            #btn-reset {
                display: block;
                width: 100%;
                margin-right: 0;
                margin-bottom: 10px;
                text-align: center;
            }

            #btn-reset a {
                display: block;
                text-align: center;
            }
        }

    </style>
</head>
<body>

    <h2 id="form-title">Form 1 Store Students to DB</h2>

    <form action="" method="POST" id="student-form">
        {% csrf_token %}
        {{form.as_ul}}
        <button type="submit" id="btn-store" class="btn">Store Record</button>
        <button id="btn-reset" class="btn"><a href="/erpadmin/form1/">Reset Form on storing</a></button>
    </form>

    <a target="_blank" href="/erpadmin/form1_all/" id="view-records-link">Click to see the Stored Records</a>

</body>
</html>

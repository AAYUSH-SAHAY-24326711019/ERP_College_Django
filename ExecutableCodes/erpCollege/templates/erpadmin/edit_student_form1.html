<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student Record</title>
    <style>

        /* ============================================================
           RESET
        ============================================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ============================================================
           PAGE BACKGROUND — warm paper tone
           body — styled directly, no id needed
        ============================================================ */
        body {
            min-height: 100vh;
            background: #F7F3EE;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 16px;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #2A2438;
        }

        /* ============================================================
           CARD HEADER — h1
           ADD: id="form-title"
           Letterhead frame: thick gold rule on top, hairline gold
           rule on bottom of the violet panel.
        ============================================================ */
        #form-title {
            width: 100%;
            max-width: 600px;
            background: #2E1F4D;
            color: #F7F3EE;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: clamp(1.35rem, 3vw, 1.75rem);
            letter-spacing: 0.5px;
            text-align: left;
            padding: 26px 36px 22px;
            border-top: 5px solid #BFA046;
            border-bottom: 1px solid #BFA046;
        }

        /* ============================================================
           FORM CARD — <form>
           ADD: id="student-form"
        ============================================================ */
        #student-form {
            background: #FFFFFF;
            width: 100%;
            max-width: 600px;
            padding: 36px 36px 32px;
            border: 1px solid #E5DED2;
            border-top: none;
            box-shadow: 0 10px 28px rgba(46, 31, 77, 0.08);
        }

        /* ============================================================
           FORM FIELDS
           Django's {{form.as_ul}} auto-generates:
             <ul> <li> <label> <input>
           Styled via descendant selectors on #student-form —
           no extra ids/classes required inside, and selectors
           use descendant (not direct-child) matching so they
           still work if Django adds a wrapping <div>.
        ============================================================ */
        #student-form ul,
        #student-form ol {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #student-form li::marker {
            content: none;
        }

        #student-form ul {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 32px;
        }

        #student-form li {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #student-form label {
            flex: 0 0 140px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 0.98rem;
            font-weight: 600;
            color: #2E1F4D;
            letter-spacing: 0.2px;
        }

        #student-form input {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            border: 1px solid #D7CFE3;
            border-radius: 2px;
            font-size: 0.95rem;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #2A2438;
            background: #FBFAF8;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        #student-form input:focus {
            border-color: #2E1F4D;
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(191, 160, 70, 0.18);
        }

        /* ============================================================
           UPDATE RECORD BUTTON — <button type="submit">
           ADD: id="btn-store"  class="btn"
        ============================================================ */
        #btn-store {
            background: #2E1F4D;
            color: #F7F3EE;
            border: 1px solid #2E1F4D;
            padding: 11px 26px;
            border-radius: 2px;
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease;
        }

        #btn-store:hover {
            background: #1F1536;
            border-color: #BFA046;
        }

        /* ============================================================
           RESPONSIVE — mobile (≤ 520 px)
        ============================================================ */
        @media (max-width: 520px) {

            #form-title {
                padding: 20px 22px 18px;
            }

            #student-form {
                padding: 26px 22px 28px;
            }

            #student-form li {
                flex-direction: column;
                align-items: flex-start;
                gap: 7px;
            }

            #student-form label {
                flex: none;
            }

            #student-form input {
                width: 100%;
            }

            #btn-store {
                display: block;
                width: 100%;
                text-align: center;
            }
        }

    </style>
</head>
<body>
    <h1 id="form-title">Edit Student Record</h1>
    <form method="POST" id="student-form">
        {% csrf_token %}

        {{form.as_ul}}

        <button type="submit" id="btn-store" class="btn">Update Record</button>
    </form>
</body>
</html>

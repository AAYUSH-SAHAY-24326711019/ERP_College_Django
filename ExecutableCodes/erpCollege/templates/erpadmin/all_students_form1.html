<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students List</title>
</head>
<body>
    <table border="1" cellpadding="10">
        <tr>
            <th>id</th>
            <th>name</th>
            <th>student_id</th>
            <th>course</th>
            <th>session</th>
            <th>email</th>
        </tr>
        {% for stu in students %}
            <tr>
            <td>{{stu.id}}</td>
            <td>{{stu.name}}</td>
            <td>{{stu.student_id}}</td>
            <td>{{stu.course}}</td>
            <td>{{stu.session}}</td>
            <td>{{stu.email}}</td>
            <td><a href="/erpadmin/form1_edit/{{stu.id}}">Edit</a></td>
            </tr>

        {% endfor %}
    </table>
    
</body>
</html>

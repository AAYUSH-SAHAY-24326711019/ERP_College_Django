<!DOCTYPE html>
<html>

<head>
    <title>Mark Attendance</title>
    <style>

        /* ============================================================
           RESET
        ============================================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ============================================================
           PAGE BACKGROUND — warm paper tone, same as the rest of the
           ERP suite
        ============================================================ */
        body {
            min-height: 100vh;
            background: #F7F3EE;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 16px;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #2A2438;
        }

        /* ============================================================
           CARD HEADER — h1
           ADD: id="form-title"
           Same letterhead frame as every other page: thick gold rule
           on top, hairline gold rule on bottom of the violet panel.
        ============================================================ */
        #form-title {
            width: 100%;
            max-width: 760px;
            background: #2E1F4D;
            color: #F7F3EE;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: clamp(1.35rem, 3vw, 1.75rem);
            letter-spacing: 0.5px;
            text-align: left;
            padding: 26px 36px 22px;
            border-top: 5px solid #BFA046;
            border-bottom: 1px solid #BFA046;
        }

        /* ============================================================
           META INFO STRIPS — the two <h3> elements
           ADD: id="meta-faculty"  /  id="meta-date"
           Rendered as a pair of stacked lavender strips with a gold
           left rule, same family as the instructions block on the
           form pages — sits between the header and the form card.
        ============================================================ */
        #meta-faculty,
        #meta-date {
            display: flex;
            align-items: baseline;
            gap: 8px;
            width: 100%;
            max-width: 760px;
            background: #F3EEF8;
            border: 1px solid #E5DED2;
            border-top: none;
            border-left: 4px solid #BFA046;
            padding: 12px 36px;
            font-size: 0.95rem;
            font-weight: 400;
            color: #564A6E;
        }

        #meta-date {
            border-bottom: none;
        }

        #meta-faculty::before {
            content: "Faculty";
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #2E1F4D;
            flex: 0 0 90px;
        }

        #meta-date::before {
            content: "Date";
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #2E1F4D;
            flex: 0 0 90px;
        }

        /* Hide the literal "Faculty :" / "Date :" text rendered by
           Django so only the value remains — the labels above
           (::before) replace them visually. */
        #meta-faculty,
        #meta-date {
            font-size: 0;
        }

        #meta-faculty::before,
        #meta-date::before {
            font-size: 0.78rem;
        }

        #meta-faculty::after,
        #meta-date::after {
            font-size: 0.95rem;
        }

        /* ============================================================
           FORM CARD — <form>
           ADD: id="student-form"
        ============================================================ */
        #student-form {
            background: #FFFFFF;
            width: 100%;
            max-width: 760px;
            padding: 36px 36px 32px;
            border: 1px solid #E5DED2;
            border-top: none;
            box-shadow: 0 10px 28px rgba(46, 31, 77, 0.08);
        }

        /* Remove the original spacer <br> tags — spacing is now
           handled by margins/gaps on the elements themselves. */
        #student-form br {
            display: none;
        }

        /* ============================================================
           FIELD LABELS & SELECTS
           Styled via descendant selectors — no extra ids/classes
           needed on the <label>/<select> elements themselves.
        ============================================================ */
        #student-form label {
            display: block;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #2E1F4D;
            letter-spacing: 0.2px;
            margin-bottom: 8px;
        }

        #student-form select {
            display: block;
            width: 100%;
            max-width: 360px;
            padding: 10px 14px;
            border: 1px solid #D7CFE3;
            border-radius: 2px;
            font-size: 0.95rem;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #2A2438;
            background: #FBFAF8;
            outline: none;
            margin-bottom: 24px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        #student-form select:focus {
            border-color: #2E1F4D;
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(191, 160, 70, 0.18);
        }

        /* ============================================================
           STUDENT GRID — #students-container
           Already has an id in the source; styled here to a fixed
           10-cards-per-row grid (collapsing on smaller screens).
        ============================================================ */
        #students-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 12px;
            margin: 8px 0 28px;
        }

        /* ============================================================
           STUDENT CARDS — .student-card / .absent / .present
           Re-themed into the violet / gold / paper palette while
           keeping the same absent-vs-present semantics the script
           relies on.
        ============================================================ */
        .student-card {
            width: 100%;
            height: 64px;
            border: 1px solid transparent;
            border-radius: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #F7F3EE;
            font-weight: 700;
            font-size: 0.85rem;
            font-family: 'Segoe UI', Arial, sans-serif;
            letter-spacing: 0.3px;
            transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
        }

        .student-card:hover {
            transform: translateY(-2px);
        }

        .student-card.absent {
            background: #8C3A3A;
            border-color: #6E2C2C;
        }

        .student-card.present {
            background: #3F6B4F;
            border-color: #BFA046;
        }

        /* ============================================================
           SUBMIT BUTTON — <button type="submit">
           ADD: id="btn-store"  class="btn"
        ============================================================ */
        #btn-store {
            background: #2E1F4D;
            color: #F7F3EE;
            border: 1px solid #2E1F4D;
            padding: 11px 26px;
            border-radius: 2px;
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease;
        }

        #btn-store:hover {
            background: #1F1536;
            border-color: #BFA046;
        }

        /* ============================================================
           RESPONSIVE — tablet (≤ 900 px): 5 cards per row
        ============================================================ */
        @media (max-width: 900px) {
            #students-container {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        /* ============================================================
           RESPONSIVE — mobile (≤ 520 px)
        ============================================================ */
        @media (max-width: 520px) {

            #form-title {
                padding: 20px 22px 18px;
            }

            #meta-faculty,
            #meta-date {
                padding: 12px 22px;
            }

            #meta-faculty::before,
            #meta-date::before {
                flex: 0 0 70px;
            }

            #student-form {
                padding: 26px 22px 28px;
            }

            #student-form select {
                max-width: 100%;
            }

            #students-container {
                grid-template-columns: repeat(3, 1fr);
            }

            .student-card {
                height: 56px;
                font-size: 0.78rem;
            }

            #btn-store {
                display: block;
                width: 100%;
                text-align: center;
            }
        }

    </style>
</head>

<body>

    <h1 id="form-title">Mark Attendance</h1>

    <h3 id="meta-faculty">
        Faculty :
        {{ faculty.faculty_name }}
    </h3>

    <h3 id="meta-date">
        Date :
        {{ current_datetime }}
    </h3>

    <form method="POST" id="student-form">
        {% csrf_token %}
        <label>Select Subject</label>

        <select id="subject" name="subject">

            <option value="">
                ---------
            </option>

            {% for sub in subjects %}

            <option value="{{ sub.subject_name }}">

                {{ sub.subject_name }}

            </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Select Course</label>

        <select id="course" name="course">

            <option value="">
                ---------
            </option>

            {% for course in courses %}

            <option value="{{ course.id }}">

                {{ course.complete_name }}

            </option>

            {% endfor %}

        </select>

        <br><br>
        <input type="hidden" name="present_students" id="present_students">
        <div id="students-container">

            <br><br>



        </div>
        <button type="submit" id="btn-store" class="btn">

                Submit Attendance

            </button>
    </form>

    <script>

        document.getElementById('course').addEventListener(
            'change',
            function () {

                let courseId = this.value

                fetch(`/faculty/get-students-by-course/?course_id=${courseId}`)

                    .then(response => response.json())

                    .then(data => {

                        let container = document.getElementById(
                            'students-container'
                        )

                        container.innerHTML = ''

                        data.forEach(student => {

                            let div = document.createElement('div')

                            div.classList.add(
                                'student-card',
                                'absent'
                            )

                            div.setAttribute(
                                'data-student-id',
                                student.student_id
                            )

                            div.innerHTML = student.student_id

                            div.addEventListener(
                                'click',
                                function () {

                                    if (
                                        div.classList.contains('absent')
                                    ) {

                                        div.classList.remove('absent')

                                        div.classList.add('present')

                                    }

                                    else {

                                        div.classList.remove('present')

                                        div.classList.add('absent')
                                    }

                                    updatePresentStudents()
                                }
                            )

                            container.appendChild(div)

                        })

                    })

            }
        )
        function updatePresentStudents() {

            let presentStudents = []

            document.querySelectorAll('.present')

                .forEach(div => {

                    presentStudents.push(
                        div.getAttribute('data-student-id')
                    )

                })

            document.getElementById(
                'present_students'
            ).value = presentStudents.join(',')
        }

    </script>
</body>

</html>
